<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LCUS-2 Timer</title>

<style>

body{
    font-family:sans-serif;
    background:grey;
    margin:0;
    padding-top:50px;
}
.container{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}
.timer-box{
    width:200px;
    background:white;
    padding:20px;
    border-radius:10px;
    text-align:center;
}
.bottom-box{
    width:250px;
    margin:10px auto 0 auto;
    background:white;
    padding:20px;
    border-radius:10px;
    text-align:center;
}
.round-display{
    font-size:32px;
    font-weight:bold;
    color:black;
}
.time-display{
    font-size:96px;
    font-weight:bold;
    color:black;
}
.start-btn,
.setup-btn{
    font-size:24px;
    padding:10px 30px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}
.start-btn:disabled,
.setup-btn:disabled{
    background:#ccc;
    cursor:not-allowed;
}
.IO-btn{
    font-size:24px;
    margin-right:10px;
    padding:10px 30px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}
.IO-btn:disabled{
    background:#ccc;
    cursor:not-allowed;
}
.r-time{
    font-size:24px;
    font-weight:bold;
    color:black;
    margin: 5px 0;
}
.myname-display{
    font-size:12px;
    color:black;
}

</style>
</head>

<body>

<div class="container">
    <div id="timer-ch1" class="timer-box">
        <h1>CH1</h1>
        <hr>
        <div class="round-display">Flash: 0/0</div>
        <div class="time-display">0</div>
        <button class="start-btn">Start</button>
        <br><br>
        <hr>
        <div class="r-time">0:00</div>
    </div>
    <div id="timer-ch2" class="timer-box">
        <h1>CH2</h1>
        <hr>
        <div class="round-display">Flash: 0/0</div>
        <div class="time-display">0</div>
        <button class="start-btn">Start</button>
        <br><br>
        <hr>
        <div class="r-time">0:00</div>
    </div>
</div>
<div class="bottom-box">
        <button class="IO-btn">On</button>
        <button class="setup-btn">setting</button>
        <br>
        <div class="myname-display">
            LCUS-2 Timer 261029
        </div>
</div>

<script>

const LCUS2 = {port: null, connected: false};
const CH1ON  = new Uint8Array([0xA0, 0x01, 0x01, 0xA2]);
const CH1OFF = new Uint8Array([0xA0, 0x01, 0x00, 0xA1]);
const CH2ON  = new Uint8Array([0xA0, 0x02, 0x01, 0xA3]);
const CH2OFF = new Uint8Array([0xA0, 0x02, 0x00, 0xA2]);
let pulseWidth = 300;
let rounds = 30;
let interval = 10;
let preStart = 5;
let audioCtx = null;
let isDEMO = false;

async function connectLCUS2() {
    try {
        LCUS2.port = await navigator.serial.requestPort();
        await LCUS2.port.open({
            baudRate: 9600,
            dataBits: 8,
            stopBits: 1,
            parity: "none",
            flowControl: "none"
        });
        LCUS2.connected = true;
        await allOFF();
        document.querySelector('.IO-btn').textContent = 'Off';
        document.querySelectorAll('.start-btn').forEach(btn => {
            btn.disabled = false;
        });
        document.querySelector('.IO-btn').disabled = false;
        document.querySelector('.setup-btn').disabled = false;
        updateSetupButton();
    } catch (error) {
        LCUS2.connected = false;
        LCUS2.port = null;
        console.error("Connection error: ", error);
        alert(
            "Failed to connect to LCUS-2.\n\n" +
            "Please reload this page after connecting."
        );
    }
}

async function disconnectLCUS2() {
    if (LCUS2.port) {
        await allOFF();
        try {
            await LCUS2.port.close();
        }
        catch(error) {
            console.error(error);
        }
        LCUS2.port = null;
        LCUS2.connected = false;
        document.querySelector('.IO-btn').textContent = 'On';
        isDEMO = false;
        changeMode();
    }
}

async function sendCommand(commandArray) {
    if (!LCUS2.port || !LCUS2.port.writable) return;
    const writer = LCUS2.port.writable.getWriter();
    await writer.write(commandArray);
    writer.releaseLock();
}

async function sendPulse(sigON, sigOFF) {
    await sendCommand(sigON);
    setTimeout(async ()=>{
        await sendCommand(sigOFF);
    }, pulseWidth);
}

async function allOFF() {
    await sendCommand(CH1OFF);
    await sendCommand(CH2OFF);
}

function beep(freq = 1000, duration = 2.0) {    // duration:Length of Beep
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === "suspended") {
        audioCtx.resume();
    }
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    gain.gain.value = 0;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(2.0, audioCtx.currentTime);    //1stPara:Volume of Beep
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

function changeMode() {
    document.querySelectorAll('.start-btn').forEach(btn => {
        btn.disabled = !isDEMO;
    });
    document.querySelector('.IO-btn').disabled = isDEMO
    document.querySelector('.setup-btn').disabled = !isDEMO;
}

function updateSetupButton() {
    const running = timer1.timerRunning || timer2.timerRunning;
    document.querySelector(".setup-btn").disabled = running;
    document.querySelector(".IO-btn").disabled = running;
    if (isDEMO) document.querySelector(".IO-btn").disabled = true;
}

function getValue(message, currentValue) {
    const input = prompt(message, currentValue);
    if (input === null) {
        return currentValue;
    }
    const value = parseInt(input, 10);
    return (!isNaN(value) && value > 0) ? value : currentValue;
}

function setupConfig() {
    beep(500);
    rounds = getValue("How many flashes ?", rounds);
    interval = getValue("Interval(sec) ?", interval);
    preStart = getValue("Pre-start(sec) ?", preStart);
    if (preStart > interval) {
        preStart = interval;
    }
    timer1.reset();
    timer2.reset();
}

class FlashTimer {
    constructor(box, sigON, sigOFF){
        this.roundDisplay = box.querySelector(".round-display");
        this.timeDisplay = box.querySelector(".time-display");
        this.rTime = box.querySelector(".r-time");
        this.startBtn = box.querySelector(".start-btn");
        this.roundNow = 0;
        this.timeLeft = 0;
        this.timerRunning = false;
        this.countdown = null;
        this.sigON = sigON;
        this.sigOFF = sigOFF;
        this.reset();
        this.startBtn.addEventListener("click", () => this.start());
    }

    updateRemaining(){
        const m = Math.floor(this.timeLeft/60);
        const s = String(this.timeLeft%60).padStart(2,"0");
        this.rTime.textContent = `${m}:${s}`;
    }

    reset(){
        this.roundNow = 0;
        this.timeLeft = interval*(rounds-1) + preStart;
        this.roundDisplay.textContent = "Pre-start";
        this.roundDisplay.style.color = "black";
        this.timeDisplay.textContent = preStart;
        this.timeDisplay.style.color = "black";
        this.updateRemaining();
        if(this.startBtn.textContent === 'Reset'){
            this.startBtn.textContent = 'Start';
            this.startBtn.style.backgroundColor = '#007bff';
	}
    }

    tick(){
        this.timeLeft--;
        if(this.timeLeft<=0){
            if (LCUS2.connected) sendPulse(this.sigON, this.sigOFF);
            clearInterval(this.countdown);
            this.roundDisplay.textContent = `Finish: ${rounds}/${rounds}`;
            this.roundDisplay.style.color = "red";
            this.timeDisplay.textContent = "0";
            this.rTime.textContent = "0:00";
            this.timerRunning = false;
            updateSetupButton();
            this.startBtn.textContent = 'Start';
            this.startBtn.style.backgroundColor = '#007bff';
            beep(1000);
            return;
        }
        let remain = this.timeLeft%interval;
        this.roundDisplay.textContent = `Flash: ${this.roundNow}/${rounds}`;
        this.timeDisplay.textContent = remain;
        this.updateRemaining();
        if(remain<=3 && remain>=0){
            this.timeDisplay.style.color = "red";
        }
        else{
            this.timeDisplay.style.color = "black";
        }
        if(remain===0){
            if (LCUS2.connected) sendPulse(this.sigON, this.sigOFF);
            this.roundNow++;
            this.roundDisplay.textContent = `Flash: ${this.roundNow}/${rounds}`;
            this.roundDisplay.style.color = "red";
        }
        else{
            this.roundDisplay.style.color = "black";
        }
    }

    start(){
        beep(440);
        if(this.timerRunning){
            clearInterval(this.countdown);
            this.timerRunning=false;
            updateSetupButton();
            this.startBtn.textContent = 'Reset';
            this.startBtn.style.backgroundColor = '#008b8b';
            return;
        }
        if(this.startBtn.textContent === 'Reset'){
            this.reset();
            this.startBtn.textContent = 'Start';
            this.startBtn.style.backgroundColor = '#007bff';
            return;
        }
        this.roundNow = 0;
        this.timeLeft = interval*(rounds-1) + preStart;
        this.countdown = setInterval(()=>this.tick(), 1000);
        this.timerRunning=true;
        updateSetupButton();
        this.startBtn.textContent = 'Stop'
        this.startBtn.style.backgroundColor = '#ff69b4';
    }
}

const timer1 = new FlashTimer(document.getElementById("timer-ch1"), CH1ON, CH1OFF);

const timer2 = new FlashTimer(document.getElementById("timer-ch2"), CH2ON, CH2OFF);

document.querySelector(".setup-btn").addEventListener("click", setupConfig);

document.querySelector(".IO-btn").addEventListener('click', async () => {
    beep(500);
    if (LCUS2.connected) {
        if (window.confirm(
            "Disconnect to LCUS-2?\n\n" +
            "OK: Disconnect\n" +
            "Cancel: Change the pulse width."
        )) {
            await disconnectLCUS2();
        } else {
            pulseWidth = getValue("Pulse width(msec) ? (1-500)", pulseWidth);
            if (pulseWidth > 500) pulseWidth = 500;
        }
    } else {
        if (window.confirm(
            "Connect to LCUS-2?\n\n" +
            "OK: In the next window, select USB Serial and click Connect.\n" +
            "* It might not appear on the list at first.\n" +
            "  Then wait a few tens of seconds, then reload this page.\n\n" +
            "Cancel: Go to DEMO mode."
         )) {
            await connectLCUS2();
        } else {
            alert(
                "This is DEMO mode.\n\n" +
                "To exit DEMO mode, reload this page.\n\n" +
                "You will need either the Windows version of Chrome or Edge,\n" +
                "and an LCUS-2 USB relay module."
            );
            isDEMO = true;
            changeMode();
        }
    }
});

document.addEventListener("DOMContentLoaded", function() {
    const ua = navigator.userAgent.toLowerCase();
    const isWindows = ua.includes("windows");
    const isChromeOrEdge = ua.includes("chrome") || ua.includes("edg");
    if (!isWindows || !isChromeOrEdge) {
        alert(
            "This is DEMO mode.\n\n" +
            "You will need either the Windows version of Chrome or Edge,\n" +
            "and an LCUS-2 USB relay module."
        );
        isDEMO = true;
    } else {
        isDEMO = false;
    }
    changeMode();
});

</script>

</body>
</html>
