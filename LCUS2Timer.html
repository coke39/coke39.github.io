<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LCUS2 Timer</title>

<style>

body{
    font-family:sans-serif;
    background:grey;
    margin:0;
    padding-top:50px;
}
.container{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}
.timer-box{
    width:200px;
    background:white;
    padding:20px;
    border-radius:10px;
    text-align:center;
}
.bottom-box{
    width:200px;
    margin:10px auto 0 auto;
    background:white;
    padding:20px;
    border-radius:10px;
    text-align:center;
}
.round-display{
    font-size:32px;
    font-weight:bold;
    color:black;
}
.time-display{
    font-size:96px;
    font-weight:bold;
    color:black;
}
.start-btn,
.setup-btn{
    font-size:24px;
    padding:10px 30px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}
.setup-btn:disabled{
    background:#ccc;
    cursor:not-allowed;
}
.r-time{
    font-size:24px;
    font-weight:bold;
    color:black;
    margin: 5px 0;
}
.myname-display{
    font-size:12px;
    color:black;
}

</style>
</head>

<body>

<div class="container">
    <div id="timer-ch1" class="timer-box">
        <h1>CH1</h1>
        <hr>
        <div class="round-display">Flash: 0/0</div>
        <div class="time-display">0</div>
        <button class="start-btn">start / reset</button>
        <br><br>
        <hr>
        <div class="r-time">0:00</div>
    </div>
    <div id="timer-ch2" class="timer-box">
        <h1>CH2</h1>
        <hr>
        <div class="round-display">Flash: 0/0</div>
        <div class="time-display">0</div>
        <button class="start-btn">start / reset</button>
        <br><br>
        <hr>
        <div class="r-time">0:00</div>
    </div>
</div>
<div class="bottom-box">
        <button class="setup-btn">setting</button>
        <br>
        <div class="myname-display">
            LCUS-2 Timer 261021
        </div>
</div>

<script>

let port = null;
let rounds = 30;
let interval = 10;
let preStart = 5;
let audioCtx = null;

class FlashTimer{
    constructor(box){
        this.roundDisplay = box.querySelector(".round-display");
        this.timeDisplay = box.querySelector(".time-display");
        this.rTime = box.querySelector(".r-time");
        this.startBtn = box.querySelector(".start-btn");
        this.roundNow = 0;
        this.timeLeft = 0;
        this.timerRunning = false;
        this.countdown = null;
        this.reset();
        this.startBtn.addEventListener("click", () => this.start());
    }

    updateRemaining(){
        const m = Math.floor(this.timeLeft/60);
        const s = String(this.timeLeft%60).padStart(2,"0");
        this.rTime.textContent = `${m}:${s}`;
    }

    reset(){
        this.roundNow = 0;
        this.timeLeft = interval*(rounds-1) + preStart;
        this.roundDisplay.textContent = "Pre-start";
        this.roundDisplay.style.color = "black";
        this.timeDisplay.textContent = preStart;
        this.timeDisplay.style.color = "black";
        this.updateRemaining();
    }

    tick(){
        this.timeLeft--;
        if(this.timeLeft<=0){
            clearInterval(this.countdown);
            this.roundDisplay.textContent = "Finish!";
            this.timeDisplay.textContent = "0";
            this.timerRunning = false;
            updateSetupButton();
            beep(1200,0.4);
            return;
        }
        let remain = this.timeLeft%interval;
        this.roundDisplay.textContent = `Flash: ${this.roundNow}/${rounds}`;
        this.timeDisplay.textContent = remain;
        this.updateRemaining();
        if(remain<=3 && remain>=0){
            this.timeDisplay.style.color = "red";
            if(remain===1){
                beep(600);
            }
        }
        else{
            this.timeDisplay.style.color = "black";
        }
        if(remain===0){
            this.roundNow++;
            this.roundDisplay.textContent = "Just Now!";
            this.roundDisplay.style.color = "red";
        }
        else{
            this.roundDisplay.style.color = "black";
        }
    }

    start(){
        beep(400);
        if(this.timerRunning){
            clearInterval(this.countdown);
            this.timerRunning=false;
            updateSetupButton();
            this.reset();
            return;
        }
        this.roundNow = 0;
        this.timeLeft = interval*(rounds-1) + preStart;
        this.countdown = setInterval(()=>this.tick(), 1000);
        this.timerRunning=true;
        updateSetupButton();
    }
}

function beep(freq = 1000, duration = 0.1){
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === "suspended") {
        audioCtx.resume();
    }
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

function updateSetupButton(){
    const btn = document.querySelector(".setup-btn");
    btn.disabled = timer1.timerRunning || timer2.timerRunning;
}

function getValue(message, currentValue){
    const input = prompt(message, currentValue);
    if (input === null) {
        return currentValue;
    }
    const value = parseInt(input, 10);
    return (!isNaN(value) && value > 0) ? value : currentValue;
}

function setupConfig(){
    rounds = getValue("How many flashes ?", rounds);
    interval = getValue("Interval(sec) ?", interval);
    preStart = getValue("Pre-start(sec) ?", preStart);
    if (preStart > interval) {
        preStart = interval;
    }
    timer1.reset();
    timer2.reset();
}

const timer1 = new FlashTimer(document.getElementById("timer-ch1"));
const timer2 = new FlashTimer(document.getElementById("timer-ch2"));
document.querySelector(".setup-btn").addEventListener("click", setupConfig);
document.addEventListener("DOMContentLoaded", function() {
    const ua = navigator.userAgent.toLowerCase();
    const isWindows = ua.includes("windows");
    const isChromeOrEdge = ua.includes("chrome") || ua.includes("edg");
    if (!isWindows || !isChromeOrEdge || port===null) {
        alert(
            "This is DEMO mode.\n\n" +
            "You will need either the Windows version of Chrome or Edge,\n" +
            "and an LCUS-2 USB relay module."
        );
    }
});

</script>

</body>
</html>
